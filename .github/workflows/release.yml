name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.2"
        required: true
        default: "0.1.2"

permissions:
  contents: read

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  ORBIT_APPLICATION_ID: app.orbit.dial.chaudharysk

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: version
        name: Validate version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          v="${VERSION#v}"
          grep -Fq "__version__ = \"$v\"" orbit/__init__.py
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements-lock.windows.txt
      - name: Unit and security regression tests
        run: python -m pytest -q tests
      - name: Build Orbit.exe
        run: python packaging/windows/build_exe.py
      - name: Verify packaged security and startup
        run: python tools/packaged_check.py dist/Orbit/Orbit.exe
      - name: Installer
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $compiler = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $compiler /Q "/DAppVersion=$env:APP_VERSION" packaging\windows\orbit.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compiler failed" }
          Copy-Item "dist\OrbitSetup-$env:APP_VERSION.exe" dist\Orbit-Windows-Setup.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/Orbit-Windows-Setup.exe
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements-lock.macos.txt
      - name: Unit and security regression tests
        run: python -m pytest -q tests
      - name: Source startup and native API smoke tests
        run: |
          python tools/startup_check.py
          python tools/mac_smoke.py
      - name: Build Orbit.app
        run: |
          bash packaging/mac/build_app.sh
          ditto -c -k --keepParent dist/Orbit.app dist/Orbit-macOS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/Orbit-macOS.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ORBIT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" || { echo "Release signing secrets are required"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/orbit-release.p12"
          echo "ORBIT_KEYSTORE=$RUNNER_TEMP/orbit-release.p12" >> "$GITHUB_ENV"
      - name: Debug and release unit tests and signed release APK
        working-directory: android
        env:
          ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
          ORBIT_KEY_ALIAS: orbit
          ORBIT_VERSION: ${{ needs.version.outputs.version }}
          ORBIT_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Orbit-Android.apk
      - name: Verify APK signature
        run: |
          verifier=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$verifier" verify --verbose --print-certs Orbit-Android.apk
      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-release.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: Orbit-Android.apk
          if-no-files-found: error

  release:
    needs: [version, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: Publish verified downloads and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd out
          sha256sum Orbit-Windows-Setup.exe Orbit-macOS.zip Orbit-Android.apk > SHA256SUMS.txt
          cd ..
          gh release create "$RELEASE_TAG" out/* --verify-tag --title "Orbit $RELEASE_VERSION security update" --notes-file packaging/RELEASE_NOTES.md
