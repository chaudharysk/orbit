name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then platform=windows; else platform=macos; fi
          python -m pip install --require-hashes -r requirements-lock.$platform.txt
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Render overlay offscreen
        run: python tools/render_overlay.py overlay-${{ matrix.os }}
      - name: macOS API smoke test
        if: runner.os == 'macOS'
        run: python -u tools/mac_smoke.py
      - name: Full app starts and handles injected dial events
        run: python -u tools/startup_check.py
      - name: Build Orbit.app
        if: runner.os == 'macOS'
        run: |
          bash packaging/mac/build_app.sh
          ditto -c -k --keepParent dist/Orbit.app Orbit-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: overlay-${{ matrix.os }}
          path: overlay-*.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'macOS'
        with:
          name: Orbit-macos
          path: Orbit-macos.zip
